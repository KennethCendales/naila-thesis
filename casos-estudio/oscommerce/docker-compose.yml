version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./catalog:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.6
    command: --sql-mode="NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oscommerce
      MYSQL_USER: oscommerce
      MYSQL_PASSWORD: oscommerce
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: